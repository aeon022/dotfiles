# vim:fileencoding=utf-8:foldmethod=marker
# Quake-style drop-down terminal. Toggle: kitten quick-access-terminal
# (bound to ctrl+shift+space via skhd, see ~/.config/skhd/skhdrc -
# macOS Service trigger is broken on Tahoe: kitty-quick-access.app
# fails spctl's symlink-in-bundle check, so it never registers as a Service)

lines 25
columns 80
edge top
layer overlay
# margin_left 50
# margin_right 50
background_opacity 0.45
hide_on_focus_loss no
