# vim:fileencoding=utf-8:foldmethod=marker
# Quake-style drop-down terminal. Toggle: kitten quick-access-terminal
# (bound to a global macOS hotkey via System Settings -> Keyboard ->
# Keyboard Shortcuts -> Services -> General -> "Quick access to kitty")

lines 25
columns 80
edge top
layer overlay
# margin_left 50
# margin_right 50
background_opacity 0.45
hide_on_focus_loss no
